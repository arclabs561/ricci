[package]
name = "ricci"
version = "0.11.0-dev"
edition = "2021"
rust-version = "1.95"
description = "Graph neural network layers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arclabs561/ricci"
homepage = "https://github.com/arclabs561/ricci"
documentation = "https://docs.rs/ricci"
keywords = ["gnn", "graph", "neural-network"]
categories = ["science", "algorithms"]

[workspace]

[features]
default = []
wgpu = ["burn/extension", "burn/autodiff", "burn/cubecl", "burn/wgpu", "dep:cubecl"]
metal = ["burn/extension", "burn/autodiff", "burn/cubecl", "burn/metal", "dep:cubecl"]

[dependencies]
burn = { git = "https://github.com/tracel-ai/burn", rev = "1414c8a14e5169ef5e5fc67f9b8ab01a25d6352d", default-features = false, features = ["std", "flex"] }
cubecl = { git = "https://github.com/tracel-ai/cubecl", rev = "359770be3c9fe69c0b0f4c6f7697062a86bbf4a8", default-features = false, optional = true }
# The curvature module composes the ecosystem's primitives: random-walk
# measures (lapl), hop distances (graphops), entropic W1 (wass).
graphops = "0.5"
lapl = "0.1"
ndarray = "0.16"
wass = "0.2"

[dev-dependencies]
proptest = "1.5"
hyperball = "0.1"
# The CPU default does not enable autodiff. This dev dependency enables it for
# training examples and tests; optional GPU features enable it too.
# Cargo unifies these features with the normal `burn` dep when building ricci's
# own examples/tests, without affecting downstream consumers.
burn = { git = "https://github.com/tracel-ai/burn", rev = "1414c8a14e5169ef5e5fc67f9b8ab01a25d6352d", default-features = false, features = ["std", "autodiff", "optim"] }
